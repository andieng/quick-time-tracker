name: Supabase Keep-Alive

# Supabase free-tier projects pause after 7 days of low database activity.
# Supabase says "a few requests a day" is typically enough, so this workflow
# runs every 6 hours and sends 3 real database queries to each project
# (Production and Development). Twice a week was not enough: both projects
# paused four days after a successful ping.

on:
  schedule:
    # Every 6 hours, at minute 13. The odd minute avoids the top-of-hour
    # window where GitHub most heavily delays (or drops) scheduled runs.
    - cron: "13 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Supabase (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [Production, Development]
    environment: ${{ matrix.environment }}
    steps:
      - name: Ping Supabase REST API
        env:
          # Both are stored as secrets on the Production and Development
          # environments, so `environment:` above selects the right project.
          # The request must reach Postgres: Supabase only counts database
          # activity, and the PostgREST root (`/rest/v1/`) is served from the
          # schema cache, so pinging it still let both projects pause.
          # service_role already has SELECT on feedback_rate_limit, so the
          # secret key can read it with no extra grant. This runs only in CI,
          # never in the browser.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          failed=0
          for i in 1 2 3; do
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
              "${SUPABASE_URL}/rest/v1/feedback_rate_limit?select=id&limit=1" \
              -H "apikey: ${SUPABASE_KEY}") || code="curl-error"
            echo "${{ matrix.environment }} query $i: HTTP $code"
            if [ "$code" != "200" ]; then failed=1; fi
            sleep 2
          done
          exit "$failed"
