name: Supabase Keep-Alive

# Supabase free-tier projects pause after 7 consecutive days without activity.
# This workflow makes an authenticated request to each project's PostgREST
# endpoint twice a week so neither the Production nor the Development project
# ever pauses.

on:
  schedule:
    # 07:13 UTC every Monday and Thursday (max ~4-day gap). The odd minute/hour
    # avoids the top-of-hour window where GitHub most heavily delays (or drops)
    # scheduled runs; the 4-day gap leaves comfortable slack inside the 7-day
    # pause window even if one run is skipped.
    - cron: "13 7 * * 1,4"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping Supabase (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [Production, Development]
    environment: ${{ matrix.environment }}
    steps:
      - name: Ping Supabase REST API
        env:
          # Both are stored as secrets on the Production and Development
          # environments, so `environment:` above selects the right project.
          # Hitting the PostgREST root (not a table) avoids needing any table
          # grant; it just needs the secret key. This runs only in CI, never
          # in the browser.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/" \
            -H "apikey: ${SUPABASE_KEY}")
          echo "${{ matrix.environment }}: HTTP $code"
          test "$code" = "200"
